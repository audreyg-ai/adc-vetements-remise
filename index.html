<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADC Vêtements — Remise</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}header{background:#111;color:#fff;padding:20px}header h1{margin:0;font-size:24px}main{max-width:600px;margin:auto;padding:20px}button{width:100%;border:0;border-radius:10px;padding:16px;font-size:18px;font-weight:bold;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#fff;color:#111;margin-top:10px}#scanner{display:none;background:#111;padding:10px;border-radius:12px;margin-top:15px}video{width:100%;display:block;border-radius:8px}.search{display:flex;gap:8px;margin-top:16px}.search input{flex:1;min-width:0;padding:14px;font-size:17px;border:1px solid #ccc;border-radius:8px}.search button{width:auto;font-size:16px}.message,.card{margin-top:20px;padding:18px;border-radius:10px;background:#fff}.ok{background:#e6f4ea}.error{background:#f8d7da}.client{font-size:22px;font-weight:bold}.commande{color:#666;margin-top:4px}.produit{font-size:20px;font-weight:bold;margin-top:18px}.details{font-size:19px;font-weight:bold;margin-top:6px;text-transform:uppercase}@media(max-width:600px){main{padding:12px}.search{display:block}.search button{width:100%;margin-top:8px}}
</style>
</head>
<body>
<header><h1>ADC Vêtements — Remise</h1></header>
<main>
<button class="primary" onclick="demarrer()">📷 SCANNER UN CODE-BARRES</button>
<div id="scanner"><video id="video"></video><button class="secondary" onclick="arreter()">Fermer la caméra</button></div>
<div class="search"><input id="code" placeholder="Scanner ou entrer le code" autocomplete="off"><button class="primary" onclick="chercher()">Rechercher</button></div>
<div id="resultat"></div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzjwIRc4JRoi-K2fCIO5UljIOjXOGMSWgGjNKzq9ldtnDrfrNKvzLOv_gVFNKQ84r_3/exec';
let lecteur=null, actif=false;

async function demarrer(){
 const zone=document.getElementById('resultat');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){erreur("Ce navigateur ne permet pas l’accès à la caméra.");return;}
 document.getElementById('scanner').style.display='block'; zone.innerHTML='';
 try{
  const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128]); hints.set(ZXing.DecodeHintType.TRY_HARDER,true); lecteur=lecteur||new ZXing.BrowserMultiFormatReader(hints,500); actif=true;
  await lecteur.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},focusMode:{ideal:'continuous'}}},'video',(result)=>{
   if(result&&actif){actif=false;document.getElementById('code').value=result.getText();arreter();chercher();}
  });
 }catch(e){arreter();erreur("Impossible d’ouvrir la caméra. Vérifie l’autorisation caméra.");}
}
function arreter(){actif=false;if(lecteur)lecteur.reset();document.getElementById('scanner').style.display='none';}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')chercher();});

async function chercher(){
 const code=document.getElementById('code').value.trim();
 if(!code){erreur('Veuillez scanner ou entrer un code-barres.');return;}
 document.getElementById('resultat').innerHTML='<div class="message">Recherche…</div>';
 try{
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({source:'ADC_REMISE',action:'chercher',code})});
  const article=await res.json();
  afficher(article);
 }catch(e){erreur("Impossible de joindre ADC MASTER VÊTEMENTS.");}
}
function afficher(a){
 const z=document.getElementById('resultat');
 if(!a.trouve){erreur(a.message||'Code inconnu.');return;}
 const details=[a.variante,a.taille].filter(Boolean).join(' — ');
 z.innerHTML='<div class="card"><div class="client">'+esc(a.nomClient)+'</div><div class="commande">Commande #'+esc(a.noCommande)+'</div><div class="produit">'+esc(a.produit)+'</div><div class="details">'+esc(details)+'</div><div class="message ok" style="margin-bottom:0">Article trouvé — test seulement. Aucune remise enregistrée.</div></div>';
}
function erreur(m){document.getElementById('resultat').innerHTML='<div class="message error">'+esc(m)+'</div>';}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
</script>
</body>
</html>
